[project]
name = "vip-audio-service"
version = "0.1.0"
description = "Deterministic internal audio service (ADR-0002, ADR-0019). Phase 1: probes and contract handshake only; no audio processing."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audio_service"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["audio_service"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
audio-service = "audio_service.main:run"
