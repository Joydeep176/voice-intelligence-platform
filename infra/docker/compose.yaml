# Local development stack (DEPLOYMENT_ARCHITECTURE §1). Run from the repo root:
#   docker compose -f infra/docker/compose.yaml --env-file .env up -d --wait
# Ports bind to 127.0.0.1 only. Development data must be synthetic or consented (ADR-0004).
name: vip

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    # BullMQ requires noeviction. AOF keeps queued jobs across restarts.
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
        '--appendonly',
        'yes',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 320m
    restart: unless-stopped

  # Optional: run the audio service in a container instead of `uv run` on the host.
  # Enabled with `--profile audio`. No public ingress in production (internal network only).
  audio-service:
    profiles: ['audio']
    build:
      context: ../../services/audio
    environment:
      AUDIO_SERVICE_ENV: development
      AUDIO_SERVICE_LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${AUDIO_SERVICE_PORT:-8001}:8001'
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
